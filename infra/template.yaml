AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SkillWeave judge/demo API — compact serverless deployment

Parameters:
  StageName:
    Type: String
    Default: prod
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 100
  OpenSearchEndpoint:
    Type: String
    Default: ""
    Description: Optional full-corpus OpenSearch collection/domain HTTPS endpoint
  OpenSearchCollectionArn:
    Type: String
    Default: ""
    Description: Collection/domain ARN used by the Lambda IAM read policy
  OpenSearchIndex:
    Type: String
    Default: skillweave-jobs-v1
  OpenSearchDocumentCount:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Full-corpus document count disclosed by health and metadata APIs
  OpenSearchService:
    Type: String
    Default: none
    AllowedValues: [none, aoss, es]
    Description: SigV4 service for the configured OpenSearch endpoint
  BedrockQueryModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: Bedrock model or inference profile used for online query normalization

Rules:
  OpenSearchParametersTogether:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref OpenSearchEndpoint, ""]
            - !Equals [!Ref OpenSearchCollectionArn, ""]
          - !And
            - !Not [!Equals [!Ref OpenSearchEndpoint, ""]]
            - !Not [!Equals [!Ref OpenSearchCollectionArn, ""]]
        AssertDescription: OpenSearchEndpoint and OpenSearchCollectionArn must be supplied together

Conditions:
  UseReservedConcurrency: !Not
    - !Equals [!Ref ReservedConcurrency, 0]
  UseFullCorpusOpenSearch: !And
    - !Not [!Equals [!Ref OpenSearchEndpoint, ""]]
    - !Not [!Equals [!Ref OpenSearchCollectionArn, ""]]
  UseProvisionedOpenSearch: !Equals [!Ref OpenSearchService, es]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 2048
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        INDEX_PATH: /var/task/artifacts/demo-index.json
        LTR_MODEL_PATH: /var/task/artifacts/models/ltr-quality-final.trees.json
        OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
        OPENSEARCH_INDEX: !Ref OpenSearchIndex
        OPENSEARCH_DOCUMENT_COUNT: !Ref OpenSearchDocumentCount
        OPENSEARCH_SERVICE: !Ref OpenSearchService
        OPENSEARCH_TIMEOUT_SECONDS: "4.0"
        BEDROCK_QUERY_MODEL_ID: !Ref BedrockQueryModelId
        # One structured intent runs ~120 output tokens, so a full batch needs
        # headroom that a single-answer budget never did.
        BEDROCK_QUERY_MAX_TOKENS: "4000"
        BEDROCK_QUERY_MAX_BATCH: "10"
        # A Lambda invocation serves one request, so there is no sibling query
        # to coalesce with; waiting would add latency and batch nothing. On a
        # multi-request container (ECS Fargate) set this to 1.0.
        BEDROCK_QUERY_MAX_WAIT_SECONDS: "0"
        BEDROCK_QUERY_DEADLINE_SECONDS: "2.5"
        # Precomputed intents for the head of the query distribution, shipped in
        # the bundle. Present only when the file was built before packaging.
        QUERY_INTENTS_PATH: /var/task/config/query-intents.json
        QUERY_VOCAB_PATH: /var/task/config/query-intent-vocab.json

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: ["content-type"]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 600
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey",
          "status":"$context.status","responseLatency":"$context.responseLatency"}

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../dist/skillweave-lambda.zip
      Handler: app.lambda_handler.handler
      ReservedConcurrentExecutions: !If
        - UseReservedConcurrency
        - !Ref ReservedConcurrency
        - !Ref AWS::NoValue
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
        - !If
          - UseFullCorpusOpenSearch
          - !If
            - UseProvisionedOpenSearch
            - Statement:
                - Effect: Allow
                  Action:
                    - es:ESHttpGet
                    - es:ESHttpPost
                    - es:ESHttpHead
                  Resource: !Sub ${OpenSearchCollectionArn}/*
            - Statement:
                - Effect: Allow
                  Action:
                    - aoss:APIAccessAll
                  Resource: !Ref OpenSearchCollectionArn
          - !Ref AWS::NoValue
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  SearchFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SearchFunction}
      RetentionInDays: 14

  SearchErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SkillWeave Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SearchFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  DemoUrl:
    Description: Public SkillWeave demo and judge API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/
  SearchEndpoint:
    Description: Judge endpoint
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/api/v1/jobs/search
  SearchScope:
    Description: Candidate retrieval coverage configured for the judge endpoint
    Value: !If
      - UseFullCorpusOpenSearch
      - full-corpus-opensearch
      - embedded-12000-fallback
