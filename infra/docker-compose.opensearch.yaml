services:
  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.2.0}
    container_name: skillweave-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - path.repo=/usr/share/opensearch/snapshots
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - skillweave-opensearch-data:/usr/share/opensearch/data
      - ../snapshots/opensearch:/usr/share/opensearch/snapshots

volumes:
  skillweave-opensearch-data:
