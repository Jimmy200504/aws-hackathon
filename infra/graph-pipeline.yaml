AWSTemplateFormatVersion: "2010-09-09"
Description: SkillWeave zero-LLM deterministic ECS and Step Functions graph build workflow

Parameters:
  WorkerImage:
    Type: String
  ArtifactBucketName:
    Type: String
  InputBucketName:
    Type: String
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  WorkerSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: skillweave-graph-pipeline
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GraphPipelineDataPlane
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${InputBucketName}
                  - !Sub arn:${AWS::Partition}:s3:::${InputBucketName}/*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*

  WorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: skillweave-graph-worker
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "2048"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref WorkerImage
          Essential: true
          Environment:
            - Name: ARTIFACT_BUCKET
              Value: !Ref ArtifactBucketName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  WorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: states.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunGraphTasks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:RunTask, ecs:StopTask, ecs:DescribeTasks]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt ExecutionRole.Arn, !GetAtt WorkerRole.Arn]
              - Effect: Allow
                Action: [events:PutTargets, events:PutRule, events:DescribeRule]
                Resource: "*"

  GraphWorkflow:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt WorkflowRole.Arn
      Definition:
        StartAt: DeterministicExtract
        States:
          DeterministicExtract:
            Type: Task
            Resource: arn:aws:states:::ecs:runTask.sync
            Parameters:
              LaunchType: FARGATE
              Cluster: !GetAtt Cluster.Arn
              TaskDefinition: !Ref WorkerTask
              NetworkConfiguration:
                AwsvpcConfiguration:
                  AssignPublicIp: DISABLED
                  Subnets: !Ref PrivateSubnetIds
                  SecurityGroups: !Ref WorkerSecurityGroupIds
              Overrides:
                ContainerOverrides:
                  - Name: worker
                    Command: [extract]
                    Environment:
                      - Name: RUN_SPEC_S3_URI
                        Value.$: $.run_spec_s3_uri
            Next: ResolveExactAliases
          ResolveExactAliases:
            Type: Task
            Resource: arn:aws:states:::ecs:runTask.sync
            Parameters:
              LaunchType: FARGATE
              Cluster: !GetAtt Cluster.Arn
              TaskDefinition: !Ref WorkerTask
              NetworkConfiguration:
                AwsvpcConfiguration:
                  AssignPublicIp: DISABLED
                  Subnets: !Ref PrivateSubnetIds
                  SecurityGroups: !Ref WorkerSecurityGroupIds
              Overrides:
                ContainerOverrides:
                  - Name: worker
                    Command: [resolve]
                    Environment:
                      - Name: RUN_SPEC_S3_URI
                        Value.$: $.run_spec_s3_uri
            Next: BuildStatisticalRelations
          BuildStatisticalRelations:
            Type: Task
            Resource: arn:aws:states:::ecs:runTask.sync
            Parameters:
              LaunchType: FARGATE
              Cluster: !GetAtt Cluster.Arn
              TaskDefinition: !Ref WorkerTask
              NetworkConfiguration:
                AwsvpcConfiguration:
                  AssignPublicIp: DISABLED
                  Subnets: !Ref PrivateSubnetIds
                  SecurityGroups: !Ref WorkerSecurityGroupIds
              Overrides:
                ContainerOverrides:
                  - Name: worker
                    Command: [relations]
                    Environment:
                      - Name: RUN_SPEC_S3_URI
                        Value.$: $.run_spec_s3_uri
            Next: ExportAndValidate
          ExportAndValidate:
            Type: Task
            Resource: arn:aws:states:::ecs:runTask.sync
            Parameters:
              LaunchType: FARGATE
              Cluster: !GetAtt Cluster.Arn
              TaskDefinition: !Ref WorkerTask
              NetworkConfiguration:
                AwsvpcConfiguration:
                  AssignPublicIp: DISABLED
                  Subnets: !Ref PrivateSubnetIds
                  SecurityGroups: !Ref WorkerSecurityGroupIds
              Overrides:
                ContainerOverrides:
                  - Name: worker
                    Command: [export]
                    Environment:
                      - Name: RUN_SPEC_S3_URI
                        Value.$: $.run_spec_s3_uri
            End: true

Outputs:
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  StateMachineArn:
    Value: !Ref GraphWorkflow
