openapi: 3.1.0
info:
  title: SkillWeave Search API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy service
  /api/v1/jobs/search:
    post:
      operationId: searchJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Ranked jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Invalid request
  /api/v1/graph/trace:
    post:
      operationId: traceSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Ranked jobs with top-five traversal traces
components:
  schemas:
    SearchRequest:
      type: object
      additionalProperties: true
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
        location_code:
          type: array
          items: { type: string }
        duty_code:
          type: array
          items: { type: string }
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        use_graph:
          type: boolean
          default: true
      required: [query]
    RankedJob:
      type: object
      required: [job_id, rank]
      properties:
        job_id: { type: string }
        rank: { type: integer, minimum: 1 }
        title: { type: string }
        matched_skills:
          type: array
          items: { type: string }
        graph_trace:
          type: array
          items: { type: object }
    RegionExpansion:
      type: object
      required: [county, from, evidence, explanation]
      properties:
        county:
          type: string
          description: County the behaviour graph supports adding
        from:
          type: string
          description: Searched county the evidence was measured from
        evidence:
          type: array
          description: Deterministic gates this expansion passed
          items:
            type: string
            enum: [co_selection, commute_flow]
        explanation:
          type: string
          description: One-line human-readable evidence sentence
        co_selection:
          type: object
          properties:
            co_selected: { type: integer }
            jaccard: { type: number }
            p_target_given_source: { type: number }
            p_source_given_target: { type: number }
        commute_flow:
          type: object
          properties:
            applications: { type: integer }
            reverse_applications: { type: integer }
            asymmetry: { type: number }
    RegionTrace:
      type: object
      description: >-
        Read-only region expansion evidence from the behaviour-derived region
        graph. Omitted when no searched code resolves to a domestic county.
        applied_to_ranking is always false: the subgraph acts at retrieval
        expansion and does not reorder results.
      required: [searched_counties, expansions, applied_to_ranking]
      properties:
        schema: { type: string }
        dataset_version: { type: string }
        graph_cutoff: { type: string }
        searched_counties:
          type: array
          items: { type: string }
        min_conditional: { type: number }
        expansions:
          type: array
          items:
            $ref: "#/components/schemas/RegionExpansion"
        applied_to_ranking:
          type: boolean
          enum: [false]
    SearchMeta:
      type: object
      additionalProperties: true
      properties:
        region_trace:
          $ref: "#/components/schemas/RegionTrace"
    SearchResponse:
      type: object
      required: [request_id, result]
      properties:
        request_id: { type: string }
        result:
          type: array
          items:
            $ref: "#/components/schemas/RankedJob"
        empStr: { type: string }
        meta:
          $ref: "#/components/schemas/SearchMeta"
